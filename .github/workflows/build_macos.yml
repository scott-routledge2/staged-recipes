
name: Build macOS Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: false

      - name: Build
        run: pixi run build-osx
