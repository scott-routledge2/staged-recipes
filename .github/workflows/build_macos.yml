name: Build macOS Intel

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      CI: azure
      CONDA_BLD_PATH: /Users/runner/bld
      CONFIG: osx64

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Inspect environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          env | sort | grep -E '^(CI|CONFIG|CONDA|MINIFORGE|OSX|SDK|MACOSX|IS_PR|UPLOAD)'

      - name: Build
        run: ./.scripts/run_osx_build.sh